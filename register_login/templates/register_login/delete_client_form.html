{% extends 'register_login/base.html'%}
{% load crispy_forms_tags %}
{% block title %}Edit Client{% endblock %}

{% block content %}

<div class="container">
    <h2>Confirm Deletion</h2>
    <p>Are you sure you wish to delete the client <strong>{{ client }}</strong> from the database? This action cannot be undone.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'main:client' %}">Cancel</a>
    </form>

{% endblock %}
